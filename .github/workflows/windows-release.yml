name: Windows backend checks
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: python -m pip install -r requirements.txt
      - name: Build engine and server
        run: |
          cmake -S . -B build-session -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-session --config Release -j 4
      - name: Test backend and engine
        run: |
          python -m unittest discover -s tests/scripts -p test_*.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build-session -C Release --output-on-failure
