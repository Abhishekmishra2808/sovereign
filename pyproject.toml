[project]
name = "sovereign-optimizer"
version = "1.0.0"
description = "Sovereign AI Mathematical Optimization Platform"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.27.0",
  "pydantic>=2.5.0",
  "httpx>=0.27.0",
]

[project.scripts]
sovereign-agent = "agent.cli.app:entrypoint"
sov = "agent.cli.app:entrypoint"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*", "api*"]
