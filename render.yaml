services:
  - type: web
    name: sovereign-workspace
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: SOVEREIGN_PUBLIC_ORIGIN
        value: https://sovereign-genomex.vercel.app
      - key: SOVEREIGN_FRONTEND_URL
        value: https://sovereign-genomex.vercel.app
      - key: FIREBASE_PROJECT_ID
        value: sovereign-76855
      - key: MONGODB_URI
        sync: false
      - key: SOVEREIGN_DB
        value: /var/data/workspace.db
    disk:
      name: sovereign-data
      mountPath: /var/data
      sizeGB: 1
